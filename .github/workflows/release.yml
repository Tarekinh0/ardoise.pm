# Ardoise — Release (Distribution signée, SBOM, SLSA)
# Déclenché sur tag sémantique v*.
# SRQ-P002-2..7 : signature Ed25519 (PR-001), cosign (PR-002), SBOM SPDX,
# SLSA L3, build reproductible, tarball hors ligne avec verifier.sh.
#
# PR-001 : La clé de signature Ed25519 est injectée via le secret
# SIGNING_KEY (stockée dans les GitHub Secrets, jamais dans le dépôt).
# La clé publique correspondante est dist/ardoise-signing-pub.pem.
#
# PR-002 : L'image conteneur est poussée vers GHCR puis signée avec cosign.
# PR-106 : Provenance SLSA attachée à l'image conteneur après push.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: stable

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # ============================================================
  # Build reproductible (SRQ-P002-5) — double build, signature
  # ============================================================
  build:
    name: Build & Sign
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      repo_lower: ${{ steps.repo.outputs.lower }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version: stable

      - name: Normaliser le nom du dépôt (lowercase pour GHCR)
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extraire la version du tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Premier build reproductible
        run: |
          ID_COMP=$(git rev-parse --short=12 HEAD)
          COMMIT_DATE=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH="${COMMIT_DATE}"
          CGO_ENABLED=0 GOFLAGS=-buildvcs=false go build \
            -trimpath \
            -ldflags "-s -w -buildid= \
              -X ardoise.pm/internal/cli.Version=${{ steps.version.outputs.VERSION }} \
              -X ardoise.pm/internal/cli.IDCompilation=${ID_COMP}" \
            -o ardoise-1 ./cmd/ardoise

      - name: Second build reproductible (SRQ-P002-5)
        run: |
          ID_COMP=$(git rev-parse --short=12 HEAD)
          COMMIT_DATE=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH="${COMMIT_DATE}"
          CGO_ENABLED=0 GOFLAGS=-buildvcs=false go build \
            -trimpath \
            -ldflags "-s -w -buildid= \
              -X ardoise.pm/internal/cli.Version=${{ steps.version.outputs.VERSION }} \
              -X ardoise.pm/internal/cli.IDCompilation=${ID_COMP}" \
            -o ardoise-2 ./cmd/ardoise

      - name: Vérifier build reproductible
        id: hash
        run: |
          HASH1=$(sha256sum ardoise-1 | cut -d' ' -f1)
          HASH2=$(sha256sum ardoise-2 | cut -d' ' -f1)
          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERREUR : builds non reproductibles !"
            echo "  build 1: $HASH1"
            echo "  build 2: $HASH2"
            exit 1
          fi
          echo "Build reproductible vérifié : $HASH1"
          cp ardoise-1 ardoise
          echo "sha256=$HASH1" >> "$GITHUB_OUTPUT"

      # PR-001 : Injection de la clé de signature Ed25519 depuis les secrets.
      # La clé privée n'est JAMAIS dans le dépôt. La clé publique est
      # dans dist/ardoise-signing-pub.pem (incluse dans le tarball).
      - name: Préparer la clé de signature (PR-001, SRQ-P002-2)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "ERREUR : le secret SIGNING_KEY n'est pas défini."
            echo "La signature Ed25519 est requise pour la distribution (SRQ-P002-2)."
            exit 1
          fi
          printf '%s\n' "$SIGNING_KEY" > signing-key.pem
          chmod 600 signing-key.pem
          # Vérifier que la clé publique correspondante est bien dans le dépôt
          if [ ! -f dist/ardoise-signing-pub.pem ]; then
            echo "ERREUR : clé publique absente (dist/ardoise-signing-pub.pem)."
            exit 1
          fi
          cp dist/ardoise-signing-pub.pem ardoise.pub
          # Ne pas afficher la clé dans les logs
          echo "Clé de signature chargée (taille : $(wc -c < signing-key.pem) octets)."

      - name: Signer le binaire (SRQ-P002-2)
        run: |
          openssl pkeyutl -sign -rawin -in ardoise -inkey signing-key.pem -out ardoise.sig

      - name: Vérifier la signature
        run: |
          openssl pkeyutl -verify -rawin -in ardoise -sigfile ardoise.sig -inkey ardoise.pub -pubin

      # Effacer la clé privée du disque du runner
      - name: Effacer la clé de signature
        if: always()
        run: |
          if [ -f signing-key.pem ]; then
            shred -u signing-key.pem 2>/dev/null || rm -f signing-key.pem
          fi

      - name: Installer cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1

      - name: Installer syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: Générer la page de manuel (troff)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
          pandoc docs/man.md -s -t man -o ardoise.1

      - name: Générer SBOM SPDX (SRQ-P002-4)
        run: |
          syft packages dir:. -o spdx-json=ardoise.spdx.json

      - name: Assembler le tarball hors ligne (DPO-P-002-5)
        run: |
          mkdir -p dist/ardoise
          cp ardoise ardoise.sig ardoise.pub ardoise.spdx.json ardoise.1 dist/ardoise/
          # Générer verifier.sh avec l'empreinte SHA-256 gravée
          HASH=$(sha256sum ardoise | cut -d' ' -f1)
          cat > dist/ardoise/verifier.sh << VERIFIER
          #!/bin/sh
          # verifier.sh — Vérification d'intégrité hors ligne pour ardoise.pm
          # Ce script vérifie la signature détachée et l'empreinte SHA-256
          # du binaire ardoise. Il n'effectue AUCUNE connexion réseau.
          # Usage : sh verifier.sh
          set -euo pipefail

          # Vérification de la version d'OpenSSL (PR-111) :
          # openssl pkeyutl -verify -rawin nécessite OpenSSL 3.0+.
          if ! openssl version | grep -qE "OpenSSL [3-9][0-9]*\\.|LibreSSL"; then
            echo "ERREUR : OpenSSL 3.0+ (ou LibreSSL équivalent) est requis pour la vérification Ed25519."
            echo "Version détectée : \$(openssl version 2>&1)"
            exit 10
          fi

          PINNED_SHA256="${HASH}"

          echo "=== Ardoise — Vérification d'intégrité hors ligne ==="
          echo ""

          # 1. Vérifier l'empreinte SHA-256
          echo "[1/3] Vérification de l'empreinte SHA-256..."
          COMPUTED=\$(sha256sum ardoise | cut -d' ' -f1)
          if [ "\$COMPUTED" != "\$PINNED_SHA256" ]; then
            echo "ERREUR : l'empreinte SHA-256 ne correspond pas."
            echo "  Attendu  : \$PINNED_SHA256"
            echo "  Calculé  : \$COMPUTED"
            exit 2
          fi
          echo "  OK : empreinte vérifiée."

          # 2. Vérifier la signature détachée (Ed25519)
          echo "[2/3] Vérification de la signature..."
          if ! openssl pkeyutl -verify -rawin -in ardoise -sigfile ardoise.sig -inkey ardoise.pub -pubin >/dev/null 2>&1; then
            echo "ERREUR : la signature détachée est invalide."
            exit 3
          fi
          echo "  OK : signature valide."

          # 3. Afficher le résumé du SBOM
          echo "[3/3] Résumé du SBOM (SPDX)..."
          if command -v python3 >/dev/null 2>&1; then
            python3 -c "
          import json, sys
          try:
              with open('ardoise.spdx.json') as f:
                  sbom = json.load(f)
              name = sbom.get('name', 'inconnu')
              ver = sbom.get('packages', [{}])[0].get('versionInfo', '?')
              deps = len([p for p in sbom.get('packages', []) if p.get('name')])
              print(f'  Nom : {name}')
              print(f'  Version : {ver}')
              print(f'  Dépendances : {deps}')
          except Exception as e:
              print(f'  SBOM présent (ardoise.spdx.json) — {e}')
          " 2>/dev/null || echo "  SBOM présent dans ardoise.spdx.json"
          else
            echo "  SBOM présent dans ardoise.spdx.json"
          fi

          echo ""
          echo "=== Vérification réussie ==="
          echo "Le binaire ardoise est intègre et authentique."
          VERIFIER
          chmod +x dist/ardoise/verifier.sh
          # Créer le tarball
          tar -czf ardoise-v${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz -C dist ardoise
          echo "Tarball créé : ardoise-v${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz"

      - name: Générer provenance SLSA pour le binaire (SRQ-P002-7)
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4  # v2.2.0
        with:
          subject-path: ardoise

      # ============================================================
      # Image conteneur : build, push, sign, provenance (PR-002, PR-106, PR-112)
      # ============================================================
      - name: Connexion au GitHub Container Registry (PR-002)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Construire l'image conteneur (PR-002, PR-112)
        run: |
          docker build -t ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:${{ steps.version.outputs.VERSION }} .
          docker tag ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:${{ steps.version.outputs.VERSION }} \
            ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:latest

      - name: Pousser l'image conteneur vers GHCR (PR-002)
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:${{ steps.version.outputs.VERSION }}
          docker push ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:latest

      - name: Signer l'image conteneur avec cosign (SRQ-P002-3, PR-002)
        run: |
          cosign sign --yes ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:${{ steps.version.outputs.VERSION }}

      - name: Attacher le SBOM à l'image conteneur (PR-002)
        run: |
          cosign attach sbom --sbom ardoise.spdx.json ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:${{ steps.version.outputs.VERSION }}

      # PR-106 : provenance SLSA pour l'image conteneur (après push)
      - name: Générer provenance SLSA pour l'image conteneur (PR-106)
        run: |
          cosign attest --yes --predicate ardoise.spdx.json \
            ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:${{ steps.version.outputs.VERSION }}

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2 (Node 24)
        with:
          name: ardoise v${{ steps.version.outputs.VERSION }}
          files: |
            ardoise-v${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            ardoise.spdx.json
            ardoise.1
          body: |
            ## Ardoise v${{ steps.version.outputs.VERSION }}

            ### Vérification hors ligne
            ```sh
            tar xzf ardoise-v${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            cd ardoise
            sh verifier.sh
            ```

            ### Empreinte SHA-256
            ${{ steps.hash.outputs.sha256 }}

            ### Signature Ed25519
            La signature détachée est vérifiable avec la clé publique incluse (`ardoise.pub`).

            ### Image conteneur
            ```
            docker pull ghcr.io/${{ steps.repo.outputs.lower }}/ardoise:${{ steps.version.outputs.VERSION }}
            ```

            ### Provenance SLSA
            La provenance signée est attachée au binaire et à l'image conteneur.

            ### Manuel
            ```
            ardoise man        # affiche le manuel complet
            man ./ardoise.1    # ou via la page troff livrée
            ```
