# Ardoise — CI (Continuous Integration)
# Déclenché sur chaque push et pull request.
# SRQ-P002-1 : go mod verify, go vet, go test -race, build binaire,
# build image, Trivy scan. Actions épinglées par commit SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: stable
  GOFLAGS: -buildvcs=false

permissions:
  contents: read

jobs:
  # ============================================================
  # gofmt — formatage
  # ============================================================
  format:
    name: gofmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version: stable
      - name: Vérifier gofmt
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Fichiers non formatés :"
            gofmt -l .
            exit 1
          fi

  # ============================================================
  # go vet + go test -race (SRQ-P002-1)
  # ============================================================
  tests:
    name: Tests (vet + race)
    runs-on: ubuntu-24.04
    needs: [format]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version: stable
      - name: go mod verify (SRQ-P002-1)
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test -race -count=1
        run: go test -race -count=1 ./...
        # Aucun contenu, clef ou identifiant ne doit apparaître dans les
        # sorties de test (DPO-P-002-1). Les tests du produit utilisent
        # exclusivement des données synthétiques.

  # ============================================================
  # Build binaire statique (SRQ-P002-5 : reproductible)
  # ============================================================
  binary:
    name: Build binaire
    runs-on: ubuntu-24.04
    needs: [tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version: stable
      - name: Build reproductible (SRQ-P002-5)
        run: |
          ID_COMP=$(git rev-parse --short=12 HEAD)
          COMMIT_DATE=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH="${COMMIT_DATE}"
          CGO_ENABLED=0 GOFLAGS=-buildvcs=false go build \
            -trimpath \
            -ldflags "-s -w -buildid= \
              -X ardoise.pm/internal/cli.Version=0.1.0 \
              -X ardoise.pm/internal/cli.IDCompilation=${ID_COMP}" \
            -o ardoise ./cmd/ardoise
          sha256sum ardoise | tee ardoise.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.1
        with:
          name: ardoise-binary
          path: |
            ardoise
            ardoise.sha256

  # ============================================================
  # Build image conteneur de production
  # ============================================================
  container:
    name: Build image production
    runs-on: ubuntu-24.04
    needs: [tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build image (docker)
        run: docker build -t ardoise:ci .
      - name: Trivy scan — image de production (SRQ-P002)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ardoise:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Audit rapide image
        run: |
          docker history ardoise:ci
      # PR-003 : vérifier l'utilisateur non-root avec docker inspect
      # (UBI micro n'a ni shell, ni id, ni whoami).
      - name: Vérifier utilisateur non-root (SRQ-P001-2, PR-003)
        run: |
          USER_ID=$(docker inspect ardoise:ci --format '{{.Config.User}}')
          if [ "$USER_ID" != "1000:1000" ]; then
            echo "ERREUR : utilisateur conteneur = $USER_ID, attendu 1000:1000"
            exit 1
          fi
          echo "Utilisateur conteneur vérifié : $USER_ID"

  # ============================================================
  # Build image mock-icap (PR-114)
  # ============================================================
  mock-icap:
    name: Build image mock-icap
    runs-on: ubuntu-24.04
    needs: [tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build image mock-icap (PR-114)
        run: docker build -f testdata/mock-icap/Dockerfile -t mock-icap:ci testdata/mock-icap
      - name: Vérifier utilisateur non-root (mock-icap)
        run: |
          USER_ID=$(docker inspect mock-icap:ci --format '{{.Config.User}}')
          if [ "$USER_ID" != "1000:1000" ]; then
            echo "ERREUR : utilisateur conteneur mock-icap = $USER_ID, attendu 1000:1000"
            exit 1
          fi
          echo "Utilisateur conteneur mock-icap vérifié : $USER_ID"
