    name: "Foundation — Project Scaffold, Configuration, CLI, HTTP Server Skeleton"
    status: pending
    dependencies: []
    parallel_with: []
    description: |
      Project structure, build system, TOML configuration parser for all
      options (§5 dimensions), CLI framework with all subcommands (push, get,
      info, purge, serve, version), HTTP server scaffold with TLS certificate
      loading, --verifier and --politique flags, ardoise info client command,
      mode awareness scaffold. Delivers the skeleton that all other code
      plugs into.
    adrs: [ADR-001, ADR-002, ADR-006, ADR-007, ADR-010]
    options:
      - instance config
      - transport config scaffold
      - auth config scaffold
      - retention config scaffold
      - content config scaffold
      - cache config scaffold
      - analyse config scaffold
      - journal config scaffold
      - marquage config scaffold
    inherited_from: []
    risks_resolved: []

  - id: ARDOISE-0002
    name: "Blind Mode — Core Cryptography, Push, and Get"
    status: pending
    dependencies: [ARDOISE-0001]
    parallel_with: []
    description: |
      AES-256-GCM authenticated encryption/decryption (unique key per ardoise,
      96-bit random nonce), Argon2id key derivation (64 MiB, 3 iterations,
      parallelism 4, 128-bit salt), CHIF-2 (random key, a usage unique), CHIF-5
      (5 mots mnemoniques BIP39, derive par Argon2id), CHIF-MD (multi-destinataires,
      ADR-014), identifier format with URL fragment
      security (# separator), SHA-256 fingerprint, push/get in blind mode,
      --mots, --duree, --lecture-unique, --fichier, --sortie, stdin
      identifier reading, memory hygiene ([]byte-only keys, explicit zeroing),
      constant-time comparisons, no compression before encryption.
      Full crypto test suite with test vectors.
    adrs: [ADR-003, ADR-004]
    options: [CHIF-2, CHIF-5, CHIF-MD]
    inherited_from: []
    risks_resolved: []

  - id: ARDOISE-0003
    name: "Server Store and Lifecycle — TTL, Burn-After-Reading, Retention"
    status: pending
    dependencies: [ARDOISE-0002]
    parallel_with: [ARDOISE-0004]
    description: |
      RET-2 (in-memory store, burn-after-reading at sender choice), RET-1
      (enforced burn-after-reading), RET-3 (encrypted disk-backed store,
      survives restart), TTL-1 (<=1h), TTL-2 (<=24h), TTL-3 (<=7d), configurable
      default TTL, hard ceiling maximum TTL enforcement, background expiry
      sweeper, ADR-003 structural guarantee (no unlimited retention), code 5
      indistinguishable error (inexistante/expiree/consommee). Concurrent
      push/get and expiry correctness tests.
    adrs: [ADR-003]
    options: [RET-1, RET-2, RET-3, TTL-1, TTL-2, TTL-3]
    inherited_from: []
    risks_resolved: []

  - id: ARDOISE-0004
    name: "Transport and Authentication — TLS, mTLS, Tokens, PKCS#11, Declarative"
    status: pending
    dependencies: [ARDOISE-0002]
    parallel_with: [ARDOISE-0003]
    description: |
      TLS-2 (TLS 1.3 with internal CA), TLS-3 (TLS 1.2 fallback), TLS-1
      (TLS 1.3 with CA pinning), ANSSI-compliant cipher suites, AUTH-2 (mTLS
      client certificates, configurable CN/SAN identity field), AUTH-1 (PKCS#11
      hardware tokens — smart card, FIDO), AUTH-3 (bearer token via HTTP
      header), AUTH-4 (declarative identification, marked in journals per
      ADR-005). ADR-009 enforcement: every operation requires an identity, no
      anonymous access. Client flags: --certificat, --cle, --pkcs11, --jeton,
      --ac. Environment variables for all auth material. Code 6 return.
      No InsecureSkipVerify anywhere.
    adrs: [ADR-005, ADR-009]
    options: [AUTH-1, AUTH-2, AUTH-3, AUTH-4, TLS-1, TLS-2, TLS-3]
    inherited_from: []
    risks_resolved: []

  - id: ARDOISE-0005
    name: "Analysed Mode — ICAP Integration and Server-Side Encryption"
    status: pending
    dependencies: [ARDOISE-0002, ARDOISE-0003, ARDOISE-0004]
    parallel_with: []
    description: |
      Full analysed mode (mode = "analyse"), ANA-2 (ICAP synchronous blocking
      analysis — REQMOD), ANA-1 (ICAP + entity-specific ruleset), RFC 3507
      ICAP client, fail-closed behavior (refuse on timeout, unavailability,
      or unfavorable verdict — not disableable, ADR-011), configurable ICAP
      timeout (icap_delai), CHIF-4 (server-side encryption after favorable
      verdict: key generated, returned to emitter in response, erased from
      server), cleartext only in memory during analysis window (never logged,
      never written to disk — A.3-1 residual), ANA-4 (no analysis, blind-mode
      only), client display warning before push in analysed mode, config
      validation (ICAP URL mandatory), R56 enforcement (identity source distinct
      from admin SI), code 7 return. ICAP mock server tests.
    adrs: [ADR-004, ADR-011]
    options: [ANA-1, ANA-2, ANA-4, CHIF-4]
    inherited_from: []
    risks_resolved: []

  - id: ARDOISE-0006
    name: "Journalisation and Marquage"
    status: pending
    dependencies: [ARDOISE-0003, ARDOISE-0004, ARDOISE-0005]
    parallel_with: []
    description: |
      JOURN-2 (syslog+TLS to dedicated logging zone), JOURN-1 (JOURN-2 +
      SHA-256 chainage for tamper-evident journal), JOURN-3 (local file
      journal, periodic collection), JOURN-4 (no journalisation). ADR-005
      enforcement: journal never contains content, key, or complete identifier
      — only metadata (emitter identity + mechanism, timestamps, SHA-256
      fingerprint of encrypted content, instance name, sensitivity level).
      Identity mechanism explicitly marked (authenticated vs. declarative).
      MARQ-1 (automatic sensitivity marking prepended to retrieved content),
      MARQ-2 (no marking). Client --marquage option (free text supplement,
      never replaces instance label). Non-blocking journal emission.
    adrs: [ADR-005]
    options: [JOURN-1, JOURN-2, JOURN-3, JOURN-4, MARQ-1, MARQ-2]
    inherited_from: []
    risks_resolved: []

  - id: ARDOISE-0007
    name: "Client-Side Features — Secret Detection, Cache, Destinataires, Verification"
    status: pending
    dependencies: [ARDOISE-0002, ARDOISE-0003, ARDOISE-0004, ARDOISE-0006]
    parallel_with: []
    description: |
      ANA-3 (client-side secret detection via Qindu engine — note R-006 license
      bridge), --secrets modes (bloquer/demander/signaler), server-enforced
      minimum mode, --sans-confirmation/-y, code 4 return. CACHE-1 (no
      retention), CACHE-2 (local cache of encrypted content, indexed by
      server-id fingerprint, purged at ardoise expiry — key stays in identifier,
