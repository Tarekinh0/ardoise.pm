    inherited_from: []
    risks_resolved: []

  - id: ARDOISE-0008
    name: "Multi-Recipient Encryption — ADR-014 Case (a)"
    status: pending
    dependencies: [ARDOISE-0002, ARDOISE-0004, ARDOISE-0007]
    parallel_with: []
    description: |
      Chiffrement multi-destinataires: content key wrapped once per recipient
      using each recipient public key. Server as optional key registry
      (users publish public keys). External IGC/PKI integration for public key
      resolution. --pour extended: when instance has key directory, encryption
      is cryptographic multi-recipient (protects against compromised server);
      when absent, falls back to server-enforced access control (Sprint 7).
      Wrapped keys embedded in encrypted payload, not in identifier.
      No Shamir, no threshold scheme per ADR-014 rationale.
    adrs: [ADR-014]
    options: []
    inherited_from: []
    risks_resolved: []

  - id: ARDOISE-0009
    name: "Container Deployment — Dockerfile, Hardening, CI/CD Pipelines"
    status: pending
    dependencies: [ARDOISE-0005, ARDOISE-0006, ARDOISE-0007]
    parallel_with: []
    description: |
      Multi-stage Dockerfile: Stage 1 compiles statically-linked Go binary;
