# Ardoise V1 — Sprint Backlog
# Canonical source of truth. Read by all agents before any action.
# Human-readable mirror: ardoise-risk-register.md

version: "1.0"
project: ardoise-pm
status: pre-implementation
last_updated: "2026-07-24"

# ── Risks ─────────────────────────────────────────────────────────────────────
# Residual risks from docs/dat.md Annex A.3 and architectural decisions.
# Each risk MUST have a resolving sprint or an explicit acceptance rationale.

risks:
  R-001:
    title: "Cleartext window in analysed mode during ICAP analysis"
    description: >
      In analysed mode, content is in cleartext in server memory during the
      ICAP analysis window. A server compromise during this window exposes
      contents in transit. Mitigated by: bounded ICAP timeout, no cleartext
      written to disk, server hardening per PA-022 (HE-1). Accepted residual
      per A.3-1 — this is a structural property of R58 compliance.
    severity: MEDIUM
    source: docs/dat.md A.3-1
    sprint_origin: ARDOISE-0005
    resolution: accepted_residual
    accepted_by: Architecture (ADR-004, ADR-011)

  R-002:
    title: "Go GC may retain key material copies in memory despite explicit erasure"
    description: >
      Go garbage collector does not guarantee absence of residual copies of
      key material after explicit zeroing. Mitigated by: dedicated buffers,
      []byte-only key handling (never string), systematic erasure, and
      environment hardening assumptions HE-1/HE-2.
    severity: LOW
    source: docs/dat.md A.3-2
    sprint_origin: ARDOISE-0002
    resolution: accepted_residual
    accepted_by: Architecture (Annexe B — hygiene memoire)

  R-003:
    title: "Identifier transmission channel is out of scope"
    description: >
      The channel by which the emitter transmits the identifier to the recipient
      is outside the product perimeter. An intercepted identifier grants
      content access until expiry — unless CHIF-MD (multi-destinataires) or CHIF-5 (mo5 mnemoniques) is
      used, which neutralizes this risk.
    severity: MEDIUM
    source: docs/dat.md A.3-3
    sprint_origin: ARDOISE-0002
    resolution: accepted_residual
    accepted_by: Architecture (Annexe A.3-3)

  R-004:
    title: "Client cache survival after server destruction (CACHE-2, CACHE-3)"
    description: >
      When client-side caching is enabled (CACHE-2, CACHE-3), content survives
      on the recipient host after server-side destruction. The disappearance
      guarantee then depends on host expiry enforcement and hardening (HE-2).
      Cache contains only ciphertext without key, but represents residual data.
    severity: MEDIUM
    source: docs/dat.md A.3-4, ADR-013
    sprint_origin: ARDOISE-0007
    resolution: accepted_residual
    accepted_by: Architecture (ADR-013, §5.9)

  R-005:
    title: "Declarative identification (AUTH-4) is forgeable"
    description: >
      Under AUTH-4, the identity recorded in journals is self-declared by the
      client and not verified. Accepted only in non-regulated contexts on
      air-gapped administration networks. Journals explicitly mark such entries
      as declarative per ADR-005.
    severity: MEDIUM
    source: docs/dat.md A.3-5, ADR-005, ADR-009
    sprint_origin: ARDOISE-0004
    resolution: accepted_residual
    accepted_by: Architecture (ADR-005, ADR-009)

  R-006:
    title: "Qindu AGPL-3.0 license incompatibility"
    description: >
      The Qindu secrets-detection engine is AGPL-3.0, which is incompatible
      with the Apache 2.0 + Commons Clause license of Ardoise (ADR-012).
      Resolution requires a dual-license bridge from the rights holder (same
      author — tarek). Until resolved, the secrets-detection feature cannot be
      distributed under the project license.
    severity: HIGH
    source: docs/dat.md ADR-012
    sprint_origin: ARDOISE-0007
    resolution: pending_legal
    blocking: ARDOISE-0007
    accepted_by: null

  R-007:
    title: "ADR-014(b) double approbation deferred to V2"
    description: >
      Double approbation (four-eyes content release) is documented as a
      reserved feature in man.md and proposed in ADR-014 but explicitly
      excluded from V1. No two-person release enforcement exists in V1.
    severity: LOW
    source: docs/dat.md ADR-014, docs/man.md §FONCTIONS RESERVEES
    sprint_origin: null
    resolution: deferred_to_v2
    accepted_by: Sprint planning (2026-07-24)

# ── Sprints ────────────────────────────────────────────────────────────────────

