# docker-compose.realicap.yml — Surcharge pour tests avec le vrai serveur ICAP
# OPSWAT MetaDefender ICAP Server (opswat/metadefendericapsrv-centos).
#
# Usage (depuis la racine du dépôt) :
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.realicap.yml up
#
# Prérequis : le serveur OPSWAT MetaDefender doit être licencié.
# Sans licence valide, utiliser le mock ICAP (profil « full »).

services:
  # Désactiver le mock-icap du profil full
  mock-icap:
    profiles:
      - disabled  # Jamais activé

  # Activer le vrai serveur ICAP (définition dans docker-compose.yml)
  real-icap:
    profiles:
      - ""  # Profil par défaut (toujours actif avec cet override)
